<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    :root { color-scheme: light dark; }
    .title { font-size: 20px; font-weight: 650; fill: #172033; }
    .zone-label { font-size: 13px; font-weight: 600; fill: #5b6475; }
    .node-label { font-size: 13.5px; font-weight: 600; fill: #172033; }
    .node-sub { font-size: 11.5px; fill: #5b6475; }
    .edge-label { font-size: 11px; fill: #5b6475; }
    .legend-text { font-size: 12px; fill: #5b6475; }
    .node { stroke: #64748b; stroke-width: 1.2; rx: 8; }
    .input { fill: #bfdbfe; }
    .process { fill: #c7d2fe; }
    .storage { fill: #99f6e4; }
    .neutral { fill: #e2e8f0; }
    .corebox { fill: #f1f5f9; }
    .zone { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 7 5; rx: 10; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; color: #475569; marker-end: url(#arrow); }
    .edge-ctl { stroke: #94a3b8; stroke-width: 1.3; fill: none; color: #94a3b8; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) {
      .title { fill: #e5e7eb; }
      .zone-label { fill: #a3adbd; }
      .node-label { fill: #e5e7eb; }
      .node-sub { fill: #a3adbd; }
      .edge-label { fill: #a3adbd; }
      .legend-text { fill: #a3adbd; }
      .node { stroke: #94a3b8; }
      .input { fill: #1d4ed8; }
      .process { fill: #4338ca; }
      .storage { fill: #0f766e; }
      .neutral { fill: #334155; }
      .corebox { fill: #1e293b; }
      .zone { stroke: #64748b; }
      .edge { stroke: #cbd5e1; color: #cbd5e1; }
      .edge-ctl { stroke: #64748b; color: #64748b; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="22" class="title" text-anchor="middle">tiny-gpu 数据通路与架构总览</text>

  <!-- Zones -->
  <rect x="20" y="30" width="220" height="760" class="zone"/>
  <text x="30" y="52" class="zone-label">外部：Host 与存储</text>
  <rect x="260" y="30" width="1000" height="760" class="zone"/>
  <text x="270" y="52" class="zone-label">GPU（gpu.sv 顶层）</text>

  <!-- External nodes -->
  <rect x="40" y="70" width="160" height="64" class="node input"/>
  <text x="120" y="96" class="node-label" text-anchor="middle">Host / DCR</text>
  <text x="120" y="114" class="node-sub" text-anchor="middle">写 block 数 → 拉高 start</text>

  <rect x="40" y="270" width="160" height="70" class="node storage"/>
  <text x="120" y="296" class="node-label" text-anchor="middle">Program Memory</text>
  <text x="120" y="314" class="node-sub" text-anchor="middle">256 × 16b 指令</text>

  <rect x="40" y="510" width="160" height="70" class="node storage"/>
  <text x="120" y="536" class="node-label" text-anchor="middle">Data Memory</text>
  <text x="120" y="554" class="node-sub" text-anchor="middle">256 × 8b，4 通道</text>

  <!-- GPU internal: dispatcher + controllers -->
  <rect x="580" y="50" width="180" height="54" class="node process"/>
  <text x="670" y="72" class="node-label" text-anchor="middle">Dispatcher</text>
  <text x="670" y="90" class="node-sub" text-anchor="middle">blockIdx → core</text>

  <rect x="300" y="270" width="170" height="56" class="node neutral"/>
  <text x="385" y="292" class="node-label" text-anchor="middle">Program Mem</text>
  <text x="385" y="310" class="node-sub" text-anchor="middle">Controller（1ch）</text>

  <rect x="300" y="530" width="170" height="56" class="node neutral"/>
  <text x="385" y="552" class="node-label" text-anchor="middle">Data Mem</text>
  <text x="385" y="570" class="node-sub" text-anchor="middle">Controller（4ch）</text>

  <!-- Cores -->
  <rect x="520" y="120" width="680" height="320" class="node corebox"/>
  <text x="536" y="140" class="zone-label">Core 0（展开）</text>
  <rect x="520" y="500" width="680" height="64" class="node corebox"/>
  <text x="860" y="534" class="node-label" text-anchor="middle">Core 1 — 结构同 Core 0（NUM_CORES 可配置）</text>

  <!-- Core 0 internals -->
  <rect x="560" y="150" width="620" height="44" class="node process"/>
  <text x="870" y="169" class="node-label" text-anchor="middle">Scheduler FSM</text>
  <text x="870" y="185" class="node-sub" text-anchor="middle">IDLE → FETCH → DECODE → REQUEST → WAIT → EXECUTE → UPDATE → DONE</text>

  <rect x="560" y="240" width="130" height="56" class="node process"/>
  <text x="625" y="262" class="node-label" text-anchor="middle">Fetcher</text>
  <text x="625" y="280" class="node-sub" text-anchor="middle">取指</text>

  <rect x="730" y="240" width="130" height="56" class="node process"/>
  <text x="795" y="262" class="node-label" text-anchor="middle">Decoder</text>
  <text x="795" y="280" class="node-sub" text-anchor="middle">译码 → 控制信号</text>

  <rect x="900" y="240" width="140" height="56" class="node process"/>
  <text x="970" y="262" class="node-label" text-anchor="middle">Registers</text>
  <text x="970" y="280" class="node-sub" text-anchor="middle">读操作数 / 写回</text>

  <rect x="560" y="350" width="130" height="56" class="node process"/>
  <text x="625" y="372" class="node-label" text-anchor="middle">PC</text>
  <text x="625" y="390" class="node-sub" text-anchor="middle">NZP / 分支</text>

  <rect x="730" y="350" width="130" height="56" class="node process"/>
  <text x="795" y="372" class="node-label" text-anchor="middle">ALU</text>
  <text x="795" y="390" class="node-sub" text-anchor="middle">算术 / 比较</text>

  <rect x="900" y="350" width="140" height="56" class="node process"/>
  <text x="970" y="372" class="node-label" text-anchor="middle">LSU</text>
  <text x="970" y="390" class="node-sub" text-anchor="middle">访存（每 thread 一个）</text>

  <!-- Data edges -->
  <path d="M 200 92 H 560 V 77 H 580" class="edge"/>
  <text x="400" y="86" class="edge-label" text-anchor="middle">start</text>

  <path d="M 670 104 V 150" class="edge"/>
  <text x="682" y="132" class="edge-label">core_start[0]</text>

  <path d="M 700 104 V 118 H 1230 V 532 H 1200" class="edge"/>
  <text x="880" y="112" class="edge-label" text-anchor="middle">core_start[1]</text>

  <path d="M 200 305 H 300" class="edge"/>
  <path d="M 470 298 H 500 V 268 H 560" class="edge"/>
  <text x="508" y="290" class="edge-label">读指令</text>

  <path d="M 200 545 H 300" class="edge"/>
  <path d="M 470 558 H 500 V 470 H 960 V 406" class="edge"/>
  <text x="700" y="464" class="edge-label" text-anchor="middle">读写请求（4ch 仲裁）</text>

  <path d="M 690 268 H 730" class="edge"/>
  <path d="M 860 268 H 900" class="edge"/>

  <path d="M 920 296 V 330 H 795 V 350" class="edge"/>
  <path d="M 940 296 V 350" class="edge"/>
  <path d="M 970 350 V 296" class="edge"/>
  <path d="M 860 378 H 1060 V 268 H 1040" class="edge"/>
  <text x="1072" y="300" class="edge-label">写回</text>

  <path d="M 730 378 H 690" class="edge"/>
  <text x="700" y="372" class="edge-label">NZP</text>
  <path d="M 625 350 V 296" class="edge"/>
  <text x="632" y="330" class="edge-label">next_pc</text>

  <!-- Control edges (dashed) -->
  <path d="M 590 194 V 240" class="edge-ctl"/>
  <path d="M 770 194 V 240" class="edge-ctl"/>
  <path d="M 960 194 V 240" class="edge-ctl"/>
  <path d="M 560 168 H 540 V 378 H 560" class="edge-ctl"/>
  <path d="M 1180 168 H 1190 V 415 H 870 V 385 H 860" class="edge-ctl"/>
  <path d="M 1180 190 H 1190 V 385 H 1040" class="edge-ctl"/>
  <text x="1170" y="290" class="edge-label" transform="rotate(-90 1170 290)" text-anchor="middle">控制信号（valid/ready）</text>

  <!-- Legend -->
  <rect x="520" y="600" width="520" height="100" class="node neutral"/>
  <line x1="536" y1="622" x2="566" y2="622" class="edge"/>
  <text x="574" y="626" class="legend-text">数据通路（实线）</text>
  <line x1="706" y1="622" x2="736" y2="622" class="edge-ctl"/>
  <text x="744" y="626" class="legend-text">控制信号（虚线）</text>
  <rect x="876" y="614" width="24" height="14" class="node process"/>
  <text x="908" y="626" class="legend-text">流水线阶段</text>
  <rect x="536" y="644" width="24" height="14" class="node storage"/>
  <text x="568" y="656" class="legend-text">存储器</text>
  <rect x="706" y="644" width="24" height="14" class="node neutral"/>
  <text x="738" y="656" class="legend-text">控制器</text>
  <rect x="876" y="644" width="24" height="14" class="node input"/>
  <text x="908" y="656" class="legend-text">Host / 输入</text>
  <text x="780" y="686" class="legend-text" text-anchor="middle">注：每个 thread 有独立 PC 计算 / 寄存器 / ALU / LSU，共享同一指令流（SIMT 教学模型）</text>
</svg>
